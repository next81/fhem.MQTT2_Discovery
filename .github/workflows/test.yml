name: Perl tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl-version: ['5.16', '5.32', '5.38', '5.42']
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}
      - name: Install test dependencies
        run: cpanm --installdeps --with-develop .
      - name: Compile production modules
        run: find lib FHEM -name '*.pm' -print0 | xargs -0 -n1 perl -Ilib/FHEM -c
      - name: Run tests with fatal warnings
        run: PERL5OPT=-Mwarnings=FATAL prove -Itests/lib -lv tests

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.42'
      - name: Install coverage dependencies
        run: cpanm --installdeps --with-develop .
      - name: Measure coverage
        run: cover -delete && PERL5OPT=-MDevel::Cover prove -Itests/lib tests && cover
